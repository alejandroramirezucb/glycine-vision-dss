name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar Ruff
        run: pip install ruff

      - name: Lint
        run: ruff check backend scripts

      - name: Formato
        run: ruff format --check backend scripts

  notebooks:
    name: Notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar estructura y sintaxis
        run: python scripts/validar_notebooks.py

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        working-directory: app
        run: flutter pub get

      - name: Verificar formato
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analizar
        working-directory: app
        run: flutter analyze
